[workspace]
resolver = "2"

members = [
    "crates/core", "crates/core/macros/",
    "crates/macros",
    "crates/binary_options_tools",
    "crates/bindings_pyo3",
    "crates/bindings_uniffi",
    "crates/bindings_uniffi/bo2_macros",
]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
darling = { version = "0.23.0", features = ["serde"] }
futures-util = "0.3.34"
kanal = "0.1.1"
rand = "0.10.2"
regex = "1.13.1"
rust_decimal = { version = "1.42.1", features = ["serde", "macros", "serde-with-float"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53.1"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect", "handshake"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uniffi = { version = "0.32.0", features = ["cli"] }
base64 = "0.22"
http = "1.5"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.0", features = ["v4", "fast-rng", "serde"] }
 zyn = "0.5.4"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = 'abort'
strip = true

[profile.dev]
opt-level = 0
debug = 1
lto = false
codegen-units = 256

