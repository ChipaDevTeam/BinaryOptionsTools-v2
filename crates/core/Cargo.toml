[package]
name = "binary-options-tools-core"
version = "0.2.16"
edition = "2021"
authors = ["ChipaDevTeam"]
repository = "https://gitlab.chipatrade.com/chipadevorg/BinaryOptionsTools-v2"
homepage = "https://chipatrade.gitlab.io/chipadevorg/BinaryOptionsTools-v2"
documentation = "https://chipatrade.gitlab.io/chipadevorg/BinaryOptionsTools-v2/"
readme = "README.md"
description = "Low-level WebSocket client and protocol handler for binary options trading. Core foundation providing connection management, message routing, and async communication primitives."
keywords = ["async", "binary-options", "tokio", "trading", "websocket"]
categories = ["api-bindings", "asynchronous", "network-programming"]
license-file = "LICENSE"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
kanal = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { version = "0.3.6", features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time"
] }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
binary-options-tools-core-macros = { path = "macros", version = "0.2.13" }
